name: Reya Deployments CI/CD
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
permissions:
  contents: read
  # Required to publish the non-blocking "Testnet Suites" check run below.
  checks: write
# NOTE: do NOT set CANNON_REGISTRY_{ADDRESS,RPC_URL,CHAIN_ID} as workflow env. They were
# set (July 2026) to move registry reads off cannon's rate-limited shared
# Infura key, which was the right problem — but per @usecannon/cli
# settings.js those env vars replace the registry LIST with a single "Custom
# Network" entry and make ~/.local/share/cannon/settings.json ignored
# entirely. The reya packages are SPLIT across BOTH registry chains (older
# proxies on Ethereum, newer routers and the omnibus baselines on Optimism),
# so a chain-10-only registry cannot resolve e.g. reya-core:1.0.0@proxy and
# every clone.* step is skipped ("deployment not found ... network 13370"),
# cascading into a whole skipped deployment and a red devnet suite.
# The "Configure cannon registries" step below covers BOTH chains on keyed
# endpoints, which is what these vars were reaching for.
jobs:
  reya-deployments-check:
    name: Reya Deployments Check
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # Cannon's default hosted IPFS read endpoint is chosen by timezone
      # (getCannonRepoRegistryUrl -> https+ipfs://<region>.repo.usecannon.com;
      # UTC CI runners resolve to us-east). All regional subdomains have been
      # decommissioned (NXDOMAIN), so `--upgrade-from reya-omnibus:latest@main`
      # can no longer download the baseline package and every cannon test fails
      # at "Checking for existing package...". Pin reads to the live, non-regional
      # base host, which still serves the packages over the Kubo /api/v0 API.
      CANNON_IPFS_URL: https+ipfs://repo.usecannon.com
      # Give the IPFS fetches real retry headroom on flaky runner networks.
      CANNON_IPFS_RETRIES: "10"
      CANNON_IPFS_TIMEOUT: "300000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "Install Foundry"
        uses: "foundry-rs/foundry-toolchain@v1"
        with:
          version: v1.2.3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'yarn'
      - name: "Install the Node.js dependencies"
        run: "yarn"
      # Package resolution asks the on-chain cannon registry for each package's
      # IPFS hash, and the reya packages are SPLIT across the two registry
      # chains (older proxies on Ethereum, newer routers and the omnibus
      # baselines on Optimism) — so BOTH must be reachable. Cannon's default
      # config reaches them through globally-shared Infura/Alchemy keys that
      # rate-limit GitHub's runner IPs, which is how every clone.* source used
      # to die "deployment not found" and the devnet deployment silently
      # skipped. The env vars can only pin ONE registry (an ETH-only pin broke
      # baseline resolution, which lives on OP), so write a settings.json
      # carrying both chains on public endpoints instead.
      - name: Configure cannon registries
        env:
          INFURA_KEY: ${{ secrets.INFURA_KEY }}
        # Keyed Infura endpoints first — the public endpoints (publicnode,
        # llamarpc) rate-limit GitHub's shared runner IPs, which the 6c045c2
        # run proved empirically: identical settings resolve fine from a
        # cold cache on a developer IP and return "deployment not found"
        # for everything on a runner. Public endpoints stay as fallback.
        run: |
          mkdir -p ~/.local/share/cannon
          cat > ~/.local/share/cannon/settings.json <<EOF
          {
            "registries": [
              {
                "name": "OP Mainnet",
                "chainId": 10,
                "rpcUrl": ["https://optimism-mainnet.infura.io/v3/${INFURA_KEY}", "https://optimism-rpc.publicnode.com"],
                "address": "0x8E5C7EFC9636A6A0408A46BB7F617094B81e5dba"
              },
              {
                "name": "Ethereum Mainnet",
                "chainId": 1,
                "rpcUrl": ["https://mainnet.infura.io/v3/${INFURA_KEY}", "https://ethereum-rpc.publicnode.com"],
                "address": "0x8E5C7EFC9636A6A0408A46BB7F617094B81e5dba"
              }
            ]
          }
          EOF
      - name: Lint Check
        run: "yarn lint:check"
      # Unit tests for the cannon-retry wrapper's failure classifier. Pure
      # shell, no deps, ~1s. Deliberately NOT continue-on-error: the wrapper
      # decides whether a red devnet run gets retried or reported, so it
      # breaking silently is exactly the failure mode it exists to prevent.
      - name: Cannon Retry Wrapper Tests
        run: ./packages/tests/scripts/cannon-retry.test.sh
      # Unit tests for the clone-source prime loop. Same reasoning as above, and
      # the same lesson learned the hard way: the loop silently primed 1 of 12
      # refs in CI while reporting "all 12 primed and verified". Uses a fake
      # cannon, so no network and ~1s.
      - name: Cannon Prime Loop Tests
        run: ./packages/tests/scripts/prime-cannon-clone-sources.test.sh
      - name: Build
        run: "yarn build"
      - name: Reya Network Cannon Test
        id: reya_network_test
        env:
          RPC_KEY: ${{ secrets.RPC_KEY }}
        run: "yarn reya_network:test"
      - name: Reya Cronos Cannon Test
        id: reya_cronos_test
        continue-on-error: true
        env:
          # Same env name for every suite (review feedback); the Conduit secret
          # is the value known to work on the cronos endpoint.
          RPC_KEY: ${{ secrets.CONDUIT_RPC_KEY }}
        run: "yarn reya_cronos:test"
      # cli-devnet (unlike the standard CLI the network/cronos suites use)
      # refuses to build a version that is already published UNLESS the package
      # is in the machine's LOCAL registry -- which a cold runner never has. So
      # prime it: fetch the published package into the local registry, which
      # both satisfies that guard and lets every step cache-hit, so the suite
      # tests the DEPLOYED state instead of replaying the whole deployment
      # against the fork (434 steps, and non-idempotent ones like
      # passive_pool_tokenize_pool_1rusd then revert PoolAlreadyTokenized).
      # CANNON_WRITE_IPFS_URL is required: fetch defaults to the decommissioned
      # region-derived repo hosts and dies with an SSL handshake failure.
      - name: Prime the local cannon registry with the published devnet package
        id: reya_devnet_package_prime
        continue-on-error: true
        env:
          # `cannon fetch` reads publishIpfsUrl (CANNON_PUBLISH_IPFS_URL) for its
          # download loader -- NOT CANNON_IPFS_URL and not CANNON_WRITE_IPFS_URL.
          # Unset, it falls back to getCannonRepoRegistryUrl(), the
          # region-derived repo hosts that were decommissioned, and dies with an
          # SSL handshake failure (EPROTO). Same trap as `cannon publish`.
          CANNON_PUBLISH_IPFS_URL: https+ipfs://repo.usecannon.com
          CANNON_WRITE_IPFS_URL: https+ipfs://repo.usecannon.com
        run: |
          set -o pipefail
          # Must use the VERSION-specific ref, not latest@main: the guard looks
          # up the exact fullPackageRef being built (e.g.
          # reya-devnet-omnibus:1.1.1@main), and fetching as `latest` stores the
          # package under a `latest` tag that the lookup never consults.
          VERSION=$(grep -m1 '^version' packages/tomls/src/omnibus/reya_devnet.toml | cut -d'"' -f2)
          REF="reya-devnet-omnibus:${VERSION}@main"
          echo "priming local registry with $REF"
          URL=$(node node_modules/@usecannon/cli-devnet/bin/cannon.js inspect "$REF" --chain-id 89346162 | grep -oE "ipfs://Qm[A-Za-z0-9]+" | head -1)
          echo "package url: $URL"
          node node_modules/@usecannon/cli-devnet/bin/cannon.js fetch "$URL" "$REF" --chain-id 89346162

      # The step above primes the omnibus package; this one primes the packages
      # the omnibus CLONES. They are separate problems: the omnibus prime
      # satisfies cli-devnet's "already published" guard, while this one fixes
      # WHICH BYTES the clone steps resolve. For 12 of the 17 devnet clone
      # sources the registry now serves artifacts rebuilt on a newer cannon
      # toolchain, and since cannon clones proxies via CREATE2, different
      # artifact bytes give a different proxy address -- e.g. PassivePool
      # resolves to 0xE93414D5...8652 here instead of the deployed
      # 0x9fDba948...abA2, so every devnet fork assertion reads a nonexistent
      # contract. Pins live in packages/tomls/src/omnibus/reya_devnet.lock.json.
      #
      # NOTE the chain id inside the script is 13370, NOT 89346162: cannon
      # resolves clone sources at CANNON_CHAIN_ID (the portable variant), so
      # priming them under the devnet chain id writes tags nothing reads.
      #
      # continue-on-error matches the devnet lane: the devnet suite is
      # advisory (reported via the separate "Testnet Suites" check run), so a
      # priming failure must not redden the merge gate.
      - name: Prime the local cannon registry with devnet's clone sources
        id: reya_devnet_prime
        continue-on-error: true
        env:
          # Same trap as the step above: `cannon fetch` reads
          # CANNON_PUBLISH_IPFS_URL for its download loader, not CANNON_IPFS_URL.
          CANNON_PUBLISH_IPFS_URL: https+ipfs://repo.usecannon.com
          CANNON_WRITE_IPFS_URL: https+ipfs://repo.usecannon.com
        run: "yarn reya_devnet:prime"

      # Skipped rather than run when priming failed. An unprimed cache does not
      # produce a smaller failure, it produces a MISLEADING one: cannon resolves
      # different artifacts, treats the deployment as stale and replays all ~2700
      # steps, so one-time genesis steps revert (PoolAlreadyTokenized) and the
      # suite reads as though the change under test broke devnet. Run
      # 33027437158 burned 1h15m that way, on a change that was fine. A skip
      # says "we did not test this"; a replay says "your PR is broken", and
      # only one of those is true.
      #
      # NOTE the cause there was NOT "a single transient IPFS miss", as this
      # comment used to claim. The prime loop was truncating after its first
      # ref and never attempting the other eleven -- see the fd-3 note in
      # prime-cannon-clone-sources.sh.
      - name: Reya Devnet Cannon Test
        id: reya_devnet_test
        if: >-
          steps.reya_devnet_package_prime.outcome == 'success' &&
          steps.reya_devnet_prime.outcome == 'success'
        continue-on-error: true
        env:
          RPC_KEY: ${{ secrets.CONDUIT_RPC_KEY }}
        run: "yarn reya_devnet:test"
      # Publishes the advisory testnet result as its OWN check run, separate from this job.
      # This job stays the merge gate (mainnet/lint/build only); the check run below reports
      # `neutral` when a testnet suite fails, which GitHub counts as passing for branch
      # protection while still rendering as a non-green icon on the PR.
      # continue-on-error is deliberate: a failure to publish must never redden the merge gate
      # (notably on fork PRs, where the token is read-only and `checks: write` is not granted).
      - name: Publish Testnet Suites Check
        if: always() && steps.reya_network_test.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CRONOS_TEST: ${{ steps.reya_cronos_test.outcome }}
          DEVNET_TEST: ${{ steps.reya_devnet_test.outcome }}
          # On pull_request, github.sha is the ephemeral merge commit; a check run attached to it
          # does not surface on the PR. The PR head SHA is the one that does.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          summary=""
          if [ "$CRONOS_TEST" = "failure" ]; then
            summary="${summary}- Reya Cronos (testnet) tests failed"$'\n'
          fi
          if [ "$DEVNET_TEST" = "failure" ]; then
            summary="${summary}- Reya Devnet fork tests failed"$'\n'
          fi

          # A skipped devnet suite is NOT a pass. It means priming failed, so the
          # suite never ran -- reporting that as "All testnet suites passed"
          # would assert something we did not test.
          skipped=""
          if [ "$DEVNET_TEST" = "skipped" ]; then
            skipped="- Reya Devnet fork tests did NOT run (cannon priming failed; see the prime steps)"$'\n'
          fi

          if [ -n "$summary" ] || [ -n "$skipped" ]; then
            conclusion="neutral"
            if [ -n "$summary" ] && [ -n "$skipped" ]; then
              title="Testnet suites reported failures, and devnet did not run (non-blocking)"
            elif [ -n "$summary" ]; then
              title="Testnet suites reported failures (non-blocking)"
            else
              title="Devnet suite did not run (non-blocking)"
            fi
            summary="${summary}${skipped}"$'\n'"Mainnet tests passed, so this does not block the merge. Check the job log before merging."
          else
            conclusion="success"
            title="All testnet suites passed"
            summary="Reya Cronos and Reya Devnet suites completed successfully."
          fi

          gh api "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name="Testnet Suites" \
            -f head_sha="$HEAD_SHA" \
            -f status="completed" \
            -f conclusion="$conclusion" \
            -f "output[title]=$title" \
            -f "output[summary]=$summary"
