name: Reya Deployments CI/CD
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
env:
  # Point cannon's on-chain package registry (Optimism mainnet) at our own RPC instead of the shared
  # public Infura key baked into cannon's DEFAULT_REGISTRY_CONFIG, which gets rate-limited (429) and
  # times out while cloning packages — crashing builds before anvil starts, after which every forked
  # test fails with "Connection refused". Mirrors the local ~/.local/share/cannon/settings.json. All
  # three are required: cannon only uses a custom registry when ADDRESS is set alongside RPC_URL/CHAIN_ID
  # (see @usecannon/cli settings.js). Set CANNON_REGISTRY_RPC_URL as a repo secret (an Optimism mainnet
  # RPC URL with your own key).
  CANNON_REGISTRY_RPC_URL: ${{ secrets.CANNON_REGISTRY_RPC_URL }}
  CANNON_REGISTRY_CHAIN_ID: "10"
  CANNON_REGISTRY_ADDRESS: "0x8E5C7EFC9636A6A0408A46BB7F617094B81e5dba"
jobs:
  reya-deployments-check:
    name: Reya Deployments Check
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # Cannon's default hosted IPFS read endpoint is chosen by timezone
      # (getCannonRepoRegistryUrl -> https+ipfs://<region>.repo.usecannon.com;
      # UTC CI runners resolve to us-east). All regional subdomains have been
      # decommissioned (NXDOMAIN), so `--upgrade-from reya-omnibus:latest@main`
      # can no longer download the baseline package and every cannon test fails
      # at "Checking for existing package...". Pin reads to the live, non-regional
      # base host, which still serves the packages over the Kubo /api/v0 API.
      CANNON_IPFS_URL: https+ipfs://repo.usecannon.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "Install Foundry"
        uses: "foundry-rs/foundry-toolchain@v1"
        with:
          version: v1.2.3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'yarn'
      - name: "Install the Node.js dependencies"
        run: "yarn"
      - name: Lint Check
        run: "yarn lint:check"
      - name: Cannon Artifact Closure Verifier Test
        run: "yarn cannon:artifact-closure:test"
      - name: Build
        run: "yarn build"
      - name: Reya Network Cannon Test
        id: reya_network_test
        env:
          RPC_KEY: ${{ secrets.RPC_KEY }}
        run: "yarn reya_network:test"
      - name: Reya Cronos Cannon Test
        id: reya_cronos_test
        continue-on-error: true
        env:
          RPC_KEY: ${{ secrets.RPC_KEY }}
        run: "yarn reya_cronos:test"
      - name: Warn on Cronos Test Failure
        if: steps.reya_cronos_test.outcome == 'failure'
        run: echo "::warning::Reya Cronos (testnet) tests failed"
      - name: Reya Devnet Simulate
        id: reya_devnet_simulate
        continue-on-error: true
        env:
          RPC_KEY: ${{ secrets.RPC_KEY }}
        run: "yarn reya_devnet:simulate"
      - name: Warn on Devnet Simulate Failure
        if: steps.reya_devnet_simulate.outcome == 'failure'
        run: echo "::warning::Reya Devnet simulation failed"
      - name: Reya Devnet Cannon Test
        id: reya_devnet_test
        continue-on-error: true
        env:
          RPC_KEY: ${{ secrets.RPC_KEY }}
        run: "yarn reya_devnet:test"
      - name: Warn on Devnet Test Failure
        if: steps.reya_devnet_test.outcome == 'failure'
        run: echo "::warning::Reya Devnet fork tests failed"
