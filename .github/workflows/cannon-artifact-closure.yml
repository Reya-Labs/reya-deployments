name: Cannon artifact closure verifier

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/cannon-artifact-closure.yml"
      - "package.json"
      - "scripts/cannon-artifact-closure.mjs"
      - "scripts/cannon-artifact-closure.test.mjs"
      - "yarn.lock"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cannon-artifact-closure.yml"
      - "package.json"
      - "scripts/cannon-artifact-closure.mjs"
      - "scripts/cannon-artifact-closure.test.mjs"
      - "yarn.lock"

permissions:
  contents: read

concurrency:
  group: cannon-artifact-closure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Exact CID closure tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.0"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Test exact CID closure verifier
        run: yarn cannon:artifact-closure:test
