####################################################################################################
# Market close — Week 1 batch, Phase B.2: force close + deactivate (reya_cronos)
#
# !!! PLACEHOLDER ACCOUNT IDS — NOT EXECUTABLE AS-IS !!!
# Every `forceCloseMarket` below carries a placeholder `accountIds` array. The real list must cover
# EVERY account holding a non-zero base in that market, including the passive pool account, or the
# call reverts with `ForceClosureResidueAboveMax` (closed longs and shorts must net out AND match the
# snapshotted open interest, each within `maxResidualBase`). Until the lists are filled in, the
# mainnet cannon test and simulate will fail on every market with non-zero open interest.
#
# To fill them in, per market, immediately before execution:
#   1. Pull every account with a non-zero base in the market off-chain (reuse the liquidator query).
#   2. Run packages/tests/script/CheckMarketCloseReadiness.s.sol against a fork with MARKET_ID,
#      EXPECTED_OI and that account list. It prints:
#        - any account below its initial margin requirement — must be ZERO of them. The close does
#          NOT check account health and does NOT socialise a shortfall or draw the insurance fund
#          (scope doc §3.8 / §3.10), so a shortfall at the locked price is simply left as bad debt.
#        - |closedLong - closedShort| and |closedLong - openInterest| — the two residuals below.
#   3. Set `marketClose_maxResidualBaseUnscaled` above both residuals and strictly below the market's
#      baseSpacing. Sixteen of these markets have baseSpacing 1e17 (0.1 base); ZRO (market 15) has
#      1e16 (0.01 base), so ZRO is the binding constraint for a single shared value. The default
#      below is 1e6 wei, matching the bound the fork check and CheckMarketCloseReadiness.s.sol use.
#
# The close is atomic and must fit in one block — there is no batching or resumable settlement.
#
# Ordering: deactivation MUST come after the close. Both `freezeMarketForClosure` and
# `forceCloseMarket` call `FeatureFlagSupport.ensureEnabledMarket`, so disabling the market first
# would make the close itself revert.
#
# Also note each close depends on that market's freeze having actually executed — `forceCloseMarket`
# rejects a market whose oracle node is not CONSTANT. The freeze is skipped by cannon (not fatal) if
# the Stork feed is stale at execution, so verify all 17 are frozen before running this batch,
# otherwise the closes silently skip too. See the header of market_close_w1.toml.
####################################################################################################

####################################################################################################
# Group 0
####################################################################################################

[invoke.market_close_w1_force_close_15zro]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "forceCloseMarket"
args = [
    "<%= settings.market15ZroId %>",
    [
        # TODO(ZRO, market 15): replace with every account holding a non-zero base.
        "<%= settings.pool1RusdAccountId %>", # passive pool account (id 4)
        "111111",                             # PLACEHOLDER
        "222222",                             # PLACEHOLDER
        "333333",                             # PLACEHOLDER
    ],
    "<%= parseEther(settings.marketClose_maxResidualBaseUnscaled) %>",
]
depends = ["invoke.market_close_w1_freeze_15zro"]

[invoke.market_close_w1_deactivate_15zro]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setFeatureFlagDenyAll"
args = [
    "<%= keccak256(defaultAbiCoder.encode(['bytes32','uint128'],[keccak256(hexlify('marketEnabled')),settings.market15ZroId])) %>",
    true,
]
depends = ["invoke.market_close_w1_force_close_15zro"]

