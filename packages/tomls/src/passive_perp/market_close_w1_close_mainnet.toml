####################################################################################################
# Market close — Week 1 batch, Phase B.2: force close + deactivate (reya_network)
#
# For 17 of the 18 markets frozen in the previous batch: `forceCloseMarket` at the locked price,
# then `setFeatureFlagDenyAll` on `marketEnabled`. The module does not disable the market itself
# (market-close-scope.md §3.6), so that is a separate call — ordered AFTER the close, because
# `forceCloseMarket` calls `ensureEnabledMarket` and would revert on an already-disabled market.
#
# ACCOUNT LISTS. Every `accountIds` array below is the complete set of accounts holding a non-zero
# base in that market, read from `getUpdatedPositionInfo` on reya_network at the snapshot below. Each list
# was reconciled against the market's own `getOpenBaseInterest`: summed longs equal summed shorts and
# equal open interest, to within the residual quoted per market. That reconciliation is the evidence
# the list is complete — `forceCloseMarket` reverts with `ForceClosureResidueAboveMax` if it is not.
#
# MAX RESIDUAL BASE. Passed per market as raw wei (UD60x18), a flat 1e9 wei (1e-9 base) for every
# market. The measured residual is kept in the comment on each line so the real dust — left by ADL
# base-multiplier scaling — stays visible and reviewable; the largest is 54,894 wei (MOVE), so 1e9
# leaves ~4 orders of magnitude of headroom for the list drifting between snapshot and execution.
#
# A flat cap cannot hide a missing position: the on-chain guard additionally requires
# `maxResidualBase < baseSpacing`, and baseSpacing is 1e17 (0.1 base) for every market here except
# ZRO at 1e16 (0.01 base) — so 1e9 is 7-8 orders of magnitude below the smallest position that could
# possibly be omitted. Anything genuinely missing is at least one baseSpacing and still reverts with
# `ForceClosureResidueAboveMax`.
#
# !! RE-MEASURE BEFORE EXECUTING !!
# Both the account list and the residual move with every trade, and these markets are reduce-only,
# not halted — trading and liquidations continue right up to the close (§3.1). Snapshot taken
# against reya_network at the block current on 14 Aug 2026. Re-run CheckMarketCloseReadiness.s.sol per market immediately before submitting: it
# reprints the account list, the two residuals, and flags any account below its initial margin. The
# close does not check account health and does not socialise a shortfall (§3.8 / §3.10).
####################################################################################################
####################################################################################################
# Group 0
####################################################################################################

# ZRO (market 15) — open interest 2,041.910000 base = $1,598.81 at $0.78299615/ZRO
# 13 accounts with non-zero base; longs = shorts = OI to within 10,013 wei
[invoke.market_close_w1_force_close_15zro]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "forceCloseMarket"
args = [
    "<%= settings.market15ZroId %>",
    [
        "17251",  #          +1,000.000000 ZRO
        "41476",  #            +555.000000 ZRO
        "128904", #            +209.000000 ZRO
        "135288", #            +200.000000 ZRO
        "18225",  #             +50.000000 ZRO
        "134477", #             +20.450000 ZRO
        "40887",  #              +5.240000 ZRO
        "23724",  #              +1.680000 ZRO
        "79924",  #              +0.430000 ZRO
        "60666",  #              +0.110000 ZRO
        "127173", #              -0.300000 ZRO
        "18073",  #            -234.526902 ZRO
        "2",      #          -1,807.083097 ZRO (passive pool)
    ],
    "1000000000", # 1e9 wei cap; measured residual 10,013 wei = 0.000000000000010013 base
]
depends = ["invoke.market_close_w1_freeze_15zro"]

[invoke.market_close_w1_deactivate_15zro]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setFeatureFlagDenyAll"
args = [
    "<%= keccak256(defaultAbiCoder.encode(['bytes32','uint128'],[keccak256(hexlify('marketEnabled')),settings.market15ZroId])) %>",
    true,
]
depends = ["invoke.market_close_w1_force_close_15zro"]

