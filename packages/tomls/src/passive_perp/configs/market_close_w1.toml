####################################################################################################
# Market close — freeze batch 1
#
# `freezeMarketForClosure` snapshots the live oracle price (enforcing `marketOrderMaxStaleDuration`,
# which is 11s for every market below), settles funding up to that instant and pins it to zero, and
# rewires the market's `oracleNodeId` to a freshly-registered CONSTANT node holding that price.
#
# Covers the 18 markets below (all already reduce-only on-chain).
#
# This file is included from `passive_perp/mainnet.toml`, which `passive_perp/testnet.toml` also includes, so every
# invoke below runs on BOTH reya_network and reya_cronos. Cronos is the rehearsal: all 18 are already reduce-only
# there except KAITO, whose `set_market_config` (from #507) has not been applied to cronos yet — the `depends` below
# orders that write before the freeze, so the reduce-only precondition holds on both networks.
#
# Preconditions enforced on-chain by `MarketCloseModule.freezeMarketForClosure`:
#   - caller is `owner`                       -> `fromCall.func = "owner"` below
#   - market is ENABLED (`ensureEnabledMarket`) -> see the AIXBT re-enable at the top of this file
#   - market is reduce-only (`maxOpenBase == 0`) -> already true in the omnibus for all 18
#
# Each freeze `depends` on its market's `set_market_config`, so that on any build where that market's
# config is re-rendered the config write lands BEFORE the freeze. Otherwise `setMarketConfiguration`
# would write the Stork `oracleNodeId` back over the CONSTANT node and silently un-freeze the market.
#
# !! FRESH PRICES ARE REQUIRED AT EXECUTION !!
# `freezeMarketForClosure` snapshots the price through `getOraclePriceForMarketOrder`, which enforces
# the market's staleness window — 11 seconds for all 18 of these. If any of the 18 Stork feeds is
# older than that when the batch executes, that market's freeze reverts with `StalePriceDetected` and
# cannon SKIPS it with a warning rather than aborting the build: a partially-frozen batch is a silent
# outcome, not a loud one. Push fresh Stork prices immediately before execution, split the batch if
# needed, and check the build output for skipped invokes afterwards.
#
# This is also why CI cannot execute these: the fork pins chain state at a block, so the last Stork
# push stops advancing while the build's `block.timestamp` runs on in wall-clock time, and every
# freeze here is minutes past the window by the time it runs. The fork checks compensate by
# refreshing the price and performing the freeze themselves — see `ensureW1MarketsFrozen` in
# packages/tests/test/reya_*/trade/MarketClose.fork.t.sol.
#
# Funding velocity: the freeze zeroes the live velocity via `freezeFunding`, and the fork check
# asserts it stays zero. Note the toml's `velocityMultiplierUnscaled` values are NOT the live ones —
# velocity is pushed on-chain by the dynamic-depth executor — so zeroing them here would not make the
# freeze durable, it would only re-run `batchSetMarketConfigurationVelocity` over all 75 markets and
# overwrite every live value with a stale one. Keeping funding from being re-armed is a devops change
# (drop these markets from DYNAMIC_DEPTH_MARKETS), not a change to this file.
#
# !! FOLLOW-UP REQUIRED AFTER THIS BATCH EXECUTES !!
# `freezeMarketForClosure` registers the CONSTANT node at execution time, so its node id is not known
# until the tx lands. The omnibus still renders `marketNNXxx_oracleNodeId = <%= settings.xxxUsdcMark
# NodeIdStork %>`. Any FUTURE change to any var in one of these 18 `[var.market_NN*]` blocks re-runs
# that market's `set_market_config` and un-freezes it. Once this batch has run, read the registered
# node ids back off-chain and pin them in the omnibus the way MKR / FTM / LAYER already are
# (`market7Mkr_oracleNodeId = <%= settings.mkrUsdcNodeIdClosing %>`).
####################################################################################################

# AIXBT (46) was disabled on-chain ahead of this plan (`marketEnabled` deny-all == true). Both
# `freezeMarketForClosure` and `forceCloseMarket` call `FeatureFlagSupport.ensureEnabledMarket`
# first, so the market has to be enabled at the instant each of them runs. It is therefore re-enabled
# here, frozen, and disabled again at the END of this same batch — see
# `market_close_w1_predisable_46aixbt` at the bottom of this file — so that AIXBT is never tradeable
# in the window between this batch and the force-close batch. The force-close batch re-enables it once
# more immediately before its `forceCloseMarket`, then disables it for good.
[invoke.market_close_w1_reenable_46aixbt]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setFeatureFlagDenyAll"
args = [
    "<%= keccak256(defaultAbiCoder.encode(['bytes32','uint128'],[keccak256(hexlify('marketEnabled')),settings.market46AixbtId])) %>",
    false,
]
depends = ["invoke.upgrade_passive_perp_proxy"]

