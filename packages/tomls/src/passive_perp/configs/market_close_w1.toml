####################################################################################################
# AIXBT — disable again, at the very end of this batch
####################################################################################################

# AIXBT was re-enabled at the top of this file only so `freezeMarketForClosure` could run on it
# (`ensureEnabledMarket`). Put it straight back to disabled here, so it is not tradeable during the
# freeze -> force-close window. Every other market in this batch stays enabled through that window on
# purpose: they hold open positions that must remain liquidatable at the locked price (scope doc
# §4a), whereas AIXBT is already at open interest 0 with no holders, so nothing is lost by shutting
# it now.
#
# AIXBT is NOT force-closed. At open interest 0 in reduce-only there is nothing to unwind, so the
# force-close batch does not touch it at all — freezing the price and disabling the market here is the
# whole of its closure. That is why this disable is final rather than a temporary state the next batch
# undoes.
#
# !! VERIFY THIS LANDED — IT CAN BE SKIPPED SILENTLY !!
# Cannon does NOT run an invoke whose dependency was skipped; it cascades with
# "dependency operation not completed". So if the AIXBT freeze above reverts with
# `StalePriceDetected` (see the staleness note at the top of this file), cannon skips it AND skips
# this disable — while `market_close_w1_reenable_46aixbt` has already succeeded, because it is not
# price-sensitive. The net result is AIXBT left ENABLED and un-frozen, warned about but not aborted.
#
# There is no way to express "run this even if the freeze was skipped" in cannon's dependency model:
# dropping the `depends` would let this run BEFORE the freeze and break it. So this is an operational
# gate, not a structural guarantee — after executing this batch, confirm:
#
#   cast call $PERP "getFeatureFlagDenyAll(bytes32)(bool)" \
#     $(cast keccak $(cast abi-encode "f(bytes32,uint128)" $(cast keccak "marketEnabled") 46)) \
#     --rpc-url https://rpc.reya.network
#
# It must return true. If it returns false, the freeze was skipped: re-push a fresh Stork price, re-run
# the batch, and re-check. The same cascade is also why the fork checks cannot assert this end state —
# the fork always skips the freeze, so AIXBT always ends enabled there.
[invoke.market_close_w1_predisable_46aixbt]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setFeatureFlagDenyAll"
args = [
    "<%= keccak256(defaultAbiCoder.encode(['bytes32','uint128'],[keccak256(hexlify('marketEnabled')),settings.market46AixbtId])) %>",
    true,
]
depends = ["invoke.market_close_w1_freeze_46aixbt"]
