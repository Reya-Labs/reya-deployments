[invoke.passive_perp_global_config]
# Provisional funding-rate cap for the fork rehearsal.
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setGlobalConfiguration"
args = [
    { coreProxy = "<%= contracts.CoreProxy.address %>", exchangeProxy_DEPRECATED = "<%= AddressZero %>", oracleManagerAddress = "<%= settings.oracleManagerProxy %>", maxAbsFundingRate = "<%= parseEther('0.1') %>", dustAccountId_DEPRECATED = "0" },
]
depends = ["invoke.upgrade_passive_perp_proxy"]
