# Fee model V3 charges only takers. The maker fields are storage-compatible
# tombstones; retain their current values and initialize the appended field to 0.
[invoke.passive_perp_set_tier0_parameters]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setFeeTierParameters"
args = [
    "0",
    { takerFee = "<%= parseEther(settings.takerFeeTier0Unscaled) %>", makerFee_DEPRECATED = "<%= parseEther(settings.makerFeeTier0Unscaled) %>", makerRebate_DEPRECATED = "0" },
]
depends = ["invoke.upgrade_passive_perp_proxy"]

