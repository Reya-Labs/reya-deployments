[clone.reyaPassivePerpRouter]
# Provisional audited-build substitute; replace with the release package.
source = "reya-instrument-passive-perp:1.1.2@router"
target = "reya-instrument-passive-perp:1.1.2@router"

# Rehearsal-only cutover guard. Mainnet is globally enabled at the pinned
# pre-upgrade block, so close execution before any proxy can be upgraded.
[invoke.passive_perp_pause_rehearsal]
target = ["<%= settings.passivePerpProxy %>"]
abi = "<%= JSON.stringify(imports.reyaPassivePerpRouter.contracts.FeatureFlagModule.abi) %>"
from = "<%= settings.owner %>"
func = "setFeatureFlagAllowAll"
args = ["<%= keccak256(hexlify('global')) %>", false]
depends = ["var.upgrade_proxy_vars", "clone.reyaPassivePerpRouter"]

[invoke.upgrade_passive_perp_proxy]
target = ["<%= settings.passivePerpProxy %>"]
abi = "<%= JSON.stringify(imports.reyaPassivePerpRouter.contracts.OwnerUpgradeModule.abi) %>"
fromCall.func = "owner"
func = "upgradeTo"
args = [
    "<%= imports.reyaPassivePerpRouter.contracts.PassivePerpRouter.address %>",
]
factory.PassivePerpProxy.abiOf = ["reyaPassivePerpRouter.PassivePerpRouter"]
factory.PassivePerpProxy.event = "Upgraded"
factory.PassivePerpProxy.arg = 0
depends = [
    "var.upgrade_proxy_vars",
    "clone.reyaPassivePerpRouter",
    "invoke.passive_perp_pause_rehearsal",
]
