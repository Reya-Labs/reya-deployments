###############################################################################
# Mainnet-state PerpOB fork rehearsal overlay
#
# This package deliberately contains only the four PerpOB router upgrades and
# the new PassivePerp configuration. Building the full mainnet omnibus from its
# published package currently replays unrelated clone steps, replacing mainnet
# token artifacts with fresh local deployments. A standalone overlay keeps the
# fork's accounts, markets, collaterals and integrations intact.
#
# This file is not a production deployment entrypoint and must not be included
# by reya_network.toml. It contains provisional packages and identities solely
# for a disposable fork rehearsal.
###############################################################################

include = [
    "../core/utils/perpob_upgrade_proxy.toml",
    "../passive_perp/utils/perpob_upgrade_proxy.toml",
    "../passive_perp/configs/perpob/feature_flags.toml",
    "../passive_perp/configs/perpob/global_config.toml",
    "../passive_perp/configs/perpob/mainnet_active_markets.toml",
    "../passive_perp/configs/perpob/fees.toml",
    "../periphery/utils/perpob_upgrade_proxy.toml",
    "../orders_gateway/utils/perpob_upgrade_proxy.toml",
]

name = "reya-mainnet-perpob-fork"
preset = "main"
version = "0.1.0"
description = "PerpOB upgrades over a pinned Reya mainnet fork"
privateSourceCode = true

