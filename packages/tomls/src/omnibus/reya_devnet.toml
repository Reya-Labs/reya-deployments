# The sRUSD devnet used to borrow from Cronos. devnet has its own now, but
# this one stays registered as a collateral on Core and must keep a resolvable
# oracle node -- see devnet/collateral_pools/tokens/srusd_legacy.toml.
legacyCronosSrusdProxyAddress = "0xb9F531A54Fc0E9AdCa1b931d9533B4e49bB2fAD6"

###############################################################################
