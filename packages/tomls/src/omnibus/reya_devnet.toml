cp1Rusd_rusd_autoExchangeInsuranceFeeUnscaled = "0.01"
cp1Rusd_rusd_autoExchangeDustThresholdUnscaled = "0.01"
cp1Rusd_rusd_bidSubmissionFeeUnscaled = "0"
