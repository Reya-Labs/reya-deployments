###############################################################################
# Reya Devnet Omnibus
#
# Minimal environment for perp orderbook (perpOB) release testing.
# Shares the Cronos testnet chain (chainId 89346162) and reuses existing
# Cronos deployments for rUSD, USDC, wETH, exchange pass, ranks and SBT.
#
# Everything that would otherwise MUTATE Cronos state is deployed per-devnet:
# the oracle manager and adapters (so registering a node for a devnet market
# or collateral does not touch Cronos), and the passive pool together with
# sRUSD (sRUSD's supply represents claims on exactly one pool, so the token
# cannot be shared once the pool is not).
#
# Deploys fresh proxies for: Core, PassivePerp, OrdersGateway, Periphery,
# OracleManager, OracleAdapters, PassivePool, sRUSD.
#
# Markets: 1 perp (ETH), 2 spot (WETH/rUSD, sRUSD/rUSD)
# Collaterals: rUSD, wETH, sRUSD
###############################################################################

include = [
    "../devnet/commons.toml",
    "utils/constants.toml",
    "../devnet/oracle_manager/oracle_manager.toml",
    "../devnet/oracle_adapters/oracle_adapters.toml",
    "../devnet/token/srusd.toml",
    "../devnet/passive_pool/passive_pool.toml",
    "../devnet/core/core.toml",
    "../devnet/passive_perp/passive_perp.toml",
    "../devnet/orders_gateway/orders_gateway.toml",
    "../devnet/periphery/periphery.toml",
    "../devnet/collateral_pools/collateral_pool_1.toml",
]

version = "1.1.1"

###############################################################################
# Existing Cronos Contract Addresses (reused, not redeployed)
###############################################################################
[var.existing_cronos_contracts]
rusdProxyAddress = "0x9DE724e7b3facF87Ce39465D3D712717182e3e55"
usdcProxyAddress = "0xfA27c7c6051344263533cc365274d9569b0272A8"
