###############################################################################
# MAINNET MARKET MIRROR (markets 2-75)
#
# Every mainnet market is registered on-chain so devnet1's contract state
# matches production and id -> symbol resolves the same in both environments.
# Only 30 are ACTIVATED off-chain (PRO-498). The other 45 carry
# maxOpenBaseUnscaled = "0" -- the contract's reduce-only state -- so they
# exist and they price, but they cannot take on exposure.
#
# The activated 30 are not a hand-picked list. They are exactly the mainnet
# markets that can still take exposure (maxOpenBase > 0), minus the two priced
# off a frozen constant node (30 FTM, 59 LAYER). 43 of mainnet's 75 markets are
# ALREADY reduce-only in production, which is why the mirror lands on 30
# without an arbitrary cut.
#
# ACTIVATED: 1eth 2btc 3sol 4arb 5op 6avax 8link 11uni 12sui 13tia 16xrp 18pepe1k 20doge 23apt 24bnb 26ada 27ldo 28pol 29near 31ena 33pendle 35grass 37dot 38ltc 43hype 50wld 62me 66aero 70paxg 74linea
#
# To activate one of the other 45: restore its maxOpenBaseUnscaled to the
# mainnet value recorded in its comment, and add it to the off-chain lists in
# reya-devops (ME MARKET_IDS + MARKET_CONFIG__PERP_MARKETS, PERP_OB_MARKET_IDS
# on api-executor / ws-exec / perp-ob-oracle-push).
###############################################################################

###############################################################################
# MAINNET MARKET MIRROR (markets 2-75)
#
# All 75 mainnet markets are registered on-chain so devnet1's contract state
# matches production and id -> symbol resolves the same in both environments.
# ACTIVATED OFF-CHAIN: 19 markets. Ids 1-30 minus the 10 mainnet already
# holds reduce-only, minus 30 FTM (no mark feed). Everything else carries
# maxOpenBaseUnscaled = "0" -- the contract's reduce-only state -- so they
# exist and they price, but cannot take on exposure.
#
# KNOWN DIVERGENCE, recorded deliberately: 10 of the activated 30 are
# ALREADY reduce-only on mainnet, so mirroring mainnet's value gives them a 0
# cap here too and they will reject every fill despite being "activated":
#   7mkr 9aave 10crv 14sei 15zro 17wif 19popcat 21kshib 22kbonk 25jto
# The effective tradeable set is therefore 20 of 30. Market 30 FTM is
# activated with real capacity but prices off a FROZEN constant closing node,
# so it trades against a static mark -- fine for load, not for price realism. Giving them real
# capacity would mean inventing risk numbers mainnet does not have, so the
# mirror is kept faithful and the gap is documented instead. If the stress
# campaign needs all 30 live, that is a deliberate follow-up decision.
#
# Of the 45 non-activated: 33 inherit 0 from mainnet, 12 are set to 0
# on devnet only (their mainnet value is recorded in each comment).
#
# To activate one of ids 31-75: restore its maxOpenBaseUnscaled to the mainnet
# value in its comment, and add it to the off-chain lists in reya-devops.
###############################################################################

