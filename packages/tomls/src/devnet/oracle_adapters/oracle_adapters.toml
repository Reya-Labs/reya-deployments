# Devnet oracle adapters: devnet's own proxy plus the shared config set.
#
# Composed piecewise rather than including ../../oracle_adapters/mainnet.toml,
# because that file includes the shared utils/deploy_proxy.toml. Including it
# here would both clone with the shared (Cronos) salt and collide on the
# `reyaOracleAdaptersProxy` clone key with the devnet proxy below.
include = [
    "deploy_proxy.toml",
    "../../oracle_adapters/utils/upgrade_proxy.toml",
    "../../oracle_adapters/configs/feature_flags.toml",
    "../../oracle_adapters/configs/global_config.toml",
    "../../oracle_adapters/configs/set_publishers.toml",
    "set_executors.toml",
    "../../oracle_adapters/configs/allow_all_executors.toml",
    "../../oracle_adapters/configs/init_lm_token_prices.toml",
    # Devnet-only SELINI/AMBER price seeds. The shared file above sets the
    # bounds for all three REYALM# pairs but seeds only HEDGE -- its SELINI and
    # AMBER seeds are commented out because mainnet includes that same file.
    "seed_lm_token_prices.toml",
]
