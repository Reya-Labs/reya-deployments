# Devnet executor authorization for devnet's OWN OracleAdapters.
#
# Replaces the shared set_executors / set_sub_second_executors /
# set_standalone_executors configs, whose storkExecutor1..20 and
# co_execution_bot4..7 slots carry CRONOS wallets. The set below is DEVNET's
# live wallet inventory, each address derived from the signing key in the
# named GCP secret (or declared next to it) on 2026-08-18 — not copied from
# another environment.
#
# The gate that matters is `subSecondExecutors`: `executors` is set
# allow-all by allow_all_executors.toml, but fresh (sub-second) payloads are
# additionally gated on subSecondExecutors membership, which has NO
# allow-all. A wallet missing here can read but not push fresh prices.

# perp-ob-oracle-push, mark-price key
# (devnet1-euwest3-reya-cronos-perp-ob-oracle-push / PERP_OB_ORACLE_PUSH_PRIVATE_KEY)
[invoke.oracle_adapters_subsecond_perp_ob_mark_pusher]
target = ["OracleAdaptersProxy"]
fromCall.func = "owner"
func = "addToFeatureFlagAllowlist"
args = [
    "<%= keccak256(hexlify('subSecondExecutors')) %>",
    "0x61548af5B40Ee331a30aBecA9Ff2237D6C753462",
]
depends = ["invoke.upgrade_oracle_adapters_proxy"]

# perp-ob-oracle-push, funding-rate key
