# Devnet CP1 wETH collateral config: uses hardcoded Cronos wETH address.
#
# Two-step oracle wiring, deliberately. The genesis pool seed performs a
# margin walk over the live collateral set, and at deployment time the fresh
# adapters hold NO stork prices — nothing can publish until the off-chain
# cutover — so any collateral pointing at a stork-lookup node would revert
# the seed with InvalidPrice. This first step therefore registers wETH
# against the rUSD CONSTANT node (resolves with no feed); the second step
# below re-points it at the real ethUsdc stork node afterwards. Both run
# inside the same cannon build, and the pool holds no wETH, so the 1.0
# interim price is never load-bearing.
[invoke.cp_1rusd_set_weth_config]
target = ["CoreProxy"]
fromCall.func = "owner"
func = "setCollateralConfig"
args = [
    "<%= settings.cp1RusdId %>",
    "<%= settings.wethProxyAddress %>",
    # TODO later: pass depositingEnabled through var (but there's no parseBool)
    { depositingEnabled = true, cap = "<%= parseUnits(settings.cp1Rusd_weth_capUnscaled, parseInt(settings.wethTokenDecimals)) %>", withdrawalWindowSize_DEPRECATED = "0", withdrawalTvlPercentageLimit_DEPRECATED = "0", autoExchangeThreshold = "<%= parseUnits(settings.cp1Rusd_weth_autoExchangeThresholdUnscaled, parseInt(settings.wethTokenDecimals)) %>", autoExchangeInsuranceFee = "<%= parseEther(settings.cp1Rusd_weth_autoExchangeInsuranceFeeUnscaled) %>", autoExchangeDustThreshold = "<%= parseUnits(settings.cp1Rusd_weth_autoExchangeDustThresholdUnscaled, parseInt(settings.wethTokenDecimals)) %>", bidSubmissionFee = "<%= parseUnits(settings.cp1Rusd_weth_bidSubmissionFeeUnscaled, parseInt(settings.wethTokenDecimals)) %>" },
    { collateralAddress = "<%= settings.cp1Rusd_wethParentConfig_collateralAddress %>", priceHaircut = "<%= parseEther(settings.cp1Rusd_wethParentConfig_priceHaircutUnscaled) %>", autoExchangeDiscount = "<%= parseEther(settings.cp1Rusd_wethParentConfig_autoExchangeDiscountUnscaled) %>", oracleNodeId = "<%= settings.rusdUsdNodeId %>" },
]
depends = [
    "var.cp_1rusd_vars",
    "invoke.cp_1rusd_set_rusd_config",
    "invoke.oracle_manager_register_node_rusd_usd",
]

# Runs LAST in the oracle wiring: the pool-node registration and the sRUSD
# collateral config both trigger getSharePrice, whose margin walk processes
# every supporting collateral's node — so wETH must still be on the constant
# until they are done. After this step, devnet1 margin actions need real
# stork prices, which arrive once the off-chain cutover points the pushers
# at this adapters instance (reya-devops #990).
[invoke.cp_1rusd_point_weth_at_stork_node]
target = ["CoreProxy"]
fromCall.func = "owner"
func = "setCollateralConfig"
args = [
    "<%= settings.cp1RusdId %>",
    "<%= settings.wethProxyAddress %>",
    { depositingEnabled = true, cap = "<%= parseUnits(settings.cp1Rusd_weth_capUnscaled, parseInt(settings.wethTokenDecimals)) %>", withdrawalWindowSize_DEPRECATED = "0", withdrawalTvlPercentageLimit_DEPRECATED = "0", autoExchangeThreshold = "<%= parseUnits(settings.cp1Rusd_weth_autoExchangeThresholdUnscaled, parseInt(settings.wethTokenDecimals)) %>", autoExchangeInsuranceFee = "<%= parseEther(settings.cp1Rusd_weth_autoExchangeInsuranceFeeUnscaled) %>", autoExchangeDustThreshold = "<%= parseUnits(settings.cp1Rusd_weth_autoExchangeDustThresholdUnscaled, parseInt(settings.wethTokenDecimals)) %>", bidSubmissionFee = "<%= parseUnits(settings.cp1Rusd_weth_bidSubmissionFeeUnscaled, parseInt(settings.wethTokenDecimals)) %>" },
    { collateralAddress = "<%= settings.cp1Rusd_wethParentConfig_collateralAddress %>", priceHaircut = "<%= parseEther(settings.cp1Rusd_wethParentConfig_priceHaircutUnscaled) %>", autoExchangeDiscount = "<%= parseEther(settings.cp1Rusd_wethParentConfig_autoExchangeDiscountUnscaled) %>", oracleNodeId = "<%= settings.cp1Rusd_wethParentConfig_oracleNodeId %>" },
]
depends = [
    "invoke.cp_1rusd_set_weth_config",
    "invoke.passive_pool_seed_pool_1rusd",
    "invoke.oracle_manager_register_node_pool_srusd",
    "invoke.cp_1rusd_set_srusd_config",
]
