# Devnet CP1 rHedge collateral config -- mirrors mainnet cp1Rusd_rhedge_*.
#
# Reuses the existing Cronos rHedge deployment. Prices off the
# REYALM#HEDGEUSDC node on devnet's OWN oracle manager, which resolves only
# because the SHARED oracle_adapters/configs/init_lm_token_prices.toml has
# written a price into the adapters' LmTokenPrice storage -- that file seeds
# HEDGE, and leaves its SELINI/AMBER seeds commented out for mainnet's sake.
#
# Nothing pushes REYALM# on any chain -- reya-off-chain filters REYA* out of
# the Stork subscription -- so that seed IS the feed.
#
# Ordering is load-bearing in both directions. Core walks the ENTIRE
# supporting-collateral set on EVERY margin computation, so this entry must
# not exist before the seed: an unresolvable node here reverts every fill,
# liquidation and funding update, exactly as the legacy Cronos sRUSD node once
# did. Proven on a fork of the devnet chain -- registering an LM token before
# seeding its pair makes getUsdNodeMarginInfo revert StalePriceDetected, and
# after seeding it returns cleanly.
#
# Like the other reused-Cronos collaterals this also runs AFTER
# core_configure_protocol, and needs the global collateral config from
# devnet/core/tokens/rhedge.toml for its decimals.
[invoke.cp_1rusd_set_rhedge_config]
target = ["CoreProxy"]
fromCall.func = "owner"
func = "setCollateralConfig"
args = [
    "<%= settings.cp1RusdId %>",
    "<%= settings.rhedgeProxyAddress %>",
    { depositingEnabled = true, cap = "<%= parseUnits(settings.cp1Rusd_rhedge_capUnscaled, parseInt(settings.rhedgeTokenDecimals)) %>", withdrawalWindowSize_DEPRECATED = "0", withdrawalTvlPercentageLimit_DEPRECATED = "0", autoExchangeThreshold = "<%= parseUnits(settings.cp1Rusd_rhedge_autoExchangeThresholdUnscaled, parseInt(settings.rhedgeTokenDecimals)) %>", autoExchangeInsuranceFee = "<%= parseEther(settings.cp1Rusd_rhedge_autoExchangeInsuranceFeeUnscaled) %>", autoExchangeDustThreshold = "<%= parseUnits(settings.cp1Rusd_rhedge_autoExchangeDustThresholdUnscaled, parseInt(settings.rhedgeTokenDecimals)) %>", bidSubmissionFee = "<%= parseUnits(settings.cp1Rusd_rhedge_bidSubmissionFeeUnscaled, parseInt(settings.rhedgeTokenDecimals)) %>" },
    { collateralAddress = "<%= settings.cp1Rusd_rhedgeParentConfig_collateralAddress %>", priceHaircut = "<%= parseEther(settings.cp1Rusd_rhedgeParentConfig_priceHaircutUnscaled) %>", autoExchangeDiscount = "<%= parseEther(settings.cp1Rusd_rhedgeParentConfig_autoExchangeDiscountUnscaled) %>", oracleNodeId = "<%= settings.cp1Rusd_rhedgeParentConfig_oracleNodeId %>" },
]
depends = [
    "var.cp_1rusd_vars",
    "invoke.cp_1rusd_set_rusd_config",
    "invoke.core_configure_protocol",
    "invoke.rhedge_global_collateral_config",
    "invoke.oracle_adapters_reya_lm_hedge_init_price",
]
