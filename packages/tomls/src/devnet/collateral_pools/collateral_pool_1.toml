# Collateral pool anchor. Every CP1 collateral entry above depends on this,
# which is why the maxCollaterals bump is pinned here rather than per token:
# with the set now sized EXACTLY at the limit (12 supporting + rUSD = 13),
# whichever registration cannon happens to order last reverts
# CollateralLimitBreached if `market_1eth_set_cp_limits` has not run yet --
# and cannon SKIPS a failing step with a warning while the build still
# "succeeds", so that would land as a silently-missing collateral rather than
# a red build. Nothing in the limits step's own dependency chain reaches back
# here, so this edge is safe.
[var.cp_1rusd_vars]
cp1RusdId = "<%= settings.market1EthId %>"
depends = ["var.market_1eth_vars", "invoke.market_1eth_set_cp_limits"]
