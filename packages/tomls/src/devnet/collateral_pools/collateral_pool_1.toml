# Devnet collateral pool config: full mainnet market mirror (75 markets),
# 13 registered collaterals.
#
# Collateral set = mainnet's full 12-token set, PLUS the legacy Cronos sRUSD
# that devnet still carries -- hence 13, and hence cp1Rusd_maxCollaterals = 13
# in the omnibus (Core counts the rUSD quote collateral in that limit, so 12
# supporting + rUSD = 13; leaving it at 12 reverts CollateralLimitBreached).
#
# The three LM tokens (rSelini, rAmber, rHedge) were held back until now
# because their REYALM# parent nodes did not resolve here: nothing pushes
# REYALM# on ANY chain -- reya-off-chain filters REYA* out of the Stork
# subscription chain-wide -- and devnet's own OracleAdapters had never had a
# price written into its LmTokenPrice storage for SELINI or AMBER, so
# process() reverted StalePriceDetected. Core walks the whole
# supporting-collateral set on EVERY margin computation, so that would have
# reverted every fill, liquidation and funding update, exactly as the legacy
# sRUSD node once did.
#
# They now resolve because devnet/oracle_adapters/seed_lm_token_prices.toml
# seeds SELINI and AMBER (HEDGE was already seeded by the shared file), which
# is precisely what mainnet does -- mainnet's rebalancer writes the same
# storage on every NAV move. A seeded LM pair never goes stale, because
# LmTokenPrice.getLatestPricePayload stamps the payload with block.timestamp
# at READ time, so devnet needs no pusher. Their entries below therefore
# depend on the seeding steps; do not reorder.
#
# Note the LM tokens carry zero margin credit in the ME's devnet1 collateral
# table (reya-chain v4.2.10, DisabledZero), so this is on-chain parity rather
# than a change in cross-margin behaviour.
#
# Markets are created in mainnet id order so devnet ids match production; each
# asserts its own id.
