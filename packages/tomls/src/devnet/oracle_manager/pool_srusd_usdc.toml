# Devnet registration of the sRUSD/USDC passive-pool node on devnet's OWN
# OracleManager.
#
# Identical to ../../oracle_manager/configs/pool/srusd_usdc.toml EXCEPT the
# `invoke.passive_pool_tokenize_pool_1rusd` dependency is dropped: devnet
# reuses the Cronos passive pool, which is already tokenized on the shared
# chain, and devnet's build has no tokenize step to depend on. The remaining
# dependencies still order this after the manager upgrade and the adapters
# configuration.
[invoke.oracle_manager_register_node_pool_srusd]
target = ["OracleManagerProxy"]
fromCall.func = "owner"
func = "registerNode"
args = [
    "<%= settings.ORACLE_MANAGER_NODE_TYPE_STORK_OFFCHAIN_LOOKUP %>",
    "<%= defaultAbiCoder.encode(['address','string'], [contracts.OracleAdaptersProxy.address, settings.poolAssetPairIdSRUSD]) %>",
    [
    ],
]
var.srusdUsdcPoolNodeId.event = "NodeRegistered"
var.srusdUsdcPoolNodeId.arg = 0
depends = [
    "invoke.upgrade_oracle_manager_proxy",
    "invoke.oracle_adapters_global_config",
]

[invoke.oracle_manager_pool_srusd_max_stale_duration]
target = ["OracleManagerProxy"]
fromCall.func = "owner"
func = "setMaxStaleDuration"
args = [
    "<%= settings.srusdUsdcPoolNodeId %>",
    "<%= settings.srusdUsdcPoolMaxDuration %>",
]
depends = ["invoke.oracle_manager_register_node_pool_srusd"]
