# Devnet registration of the sRUSD/USDC passive-pool node — the SAME
# STORK_OFFCHAIN_LOOKUP shape as ../../oracle_manager/configs/pool/
# srusd_usdc.toml, duplicated here for one reason: ordering. Registration
# calls the node's isValid, which routes getLatestPricePayload("REYAPOOL#1")
# through PassivePool.getSharePrice — and that reverts ZeroStakedSupply until
# the genesis seed has staked. The shared config's depends stop at the
# tokenize step (sufficient on cronos/mainnet, whose pools were funded long
# before this node existed), so devnet adds the seed dependency. This step
# runs BEFORE the Core manager switch (core_configure_protocol waits on it):
# the getSharePrice probe's margin walk therefore resolves the CRONOS
# manager's live nodes with real prices. Everything else — node type,
# params, exported id, staleness — is identical to the shared file; the node
# id is keccak(type, params, parents) so both definitions yield the same id.
[invoke.oracle_manager_register_node_pool_srusd]
target = ["OracleManagerProxy"]
fromCall.func = "owner"
func = "registerNode"
args = [
    "<%= settings.ORACLE_MANAGER_NODE_TYPE_STORK_OFFCHAIN_LOOKUP %>",
    "<%= defaultAbiCoder.encode(['address','string'], [contracts.OracleAdaptersProxy.address, settings.poolAssetPairIdSRUSD]) %>",
    [
    ],
]
var.srusdUsdcPoolNodeId.event = "NodeRegistered"
var.srusdUsdcPoolNodeId.arg = 0
depends = [
    "invoke.upgrade_oracle_manager_proxy",
    "invoke.oracle_adapters_global_config",
    "invoke.passive_pool_seed_pool_1rusd",
]

[invoke.oracle_manager_pool_srusd_max_stale_duration]
target = ["OracleManagerProxy"]
fromCall.func = "owner"
func = "setMaxStaleDuration"
args = [
    "<%= settings.srusdUsdcPoolNodeId %>",
    "<%= settings.srusdUsdcPoolMaxDuration %>",
]
depends = ["invoke.oracle_manager_register_node_pool_srusd"]
