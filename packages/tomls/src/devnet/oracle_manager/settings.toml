###############################################################################
# Oracle settings for devnet's own OracleManager/OracleAdapters deployment.
#
# Copied from reya_cronos.toml: devnet runs on the SAME chain with the SAME
# Stork feeds, so the asset-pair ids, stale durations and the chain-level
# Stork verifier are identical by construction. Block names are preserved
# where oracle configs `depends` on them by name (var.stork_contracts);
# everything else keeps cronos's grouping for diffability.
###############################################################################

[var.devnet_oracle_missing_vars]
salt = ""


[var.devnet_oracle_stork_publishers]
# STORK's payload-SIGNER keys (identical to cronos/mainnet: same Stork
# network signs for the shared chain). "publishers" gates whose SIGNATURE a
# payload may carry — it is NOT the Reya pusher wallets, which submit
# payloads and are gated by the "executors" flag (allow-all on devnet via
# oracle_adapters_allow_all_executors).
storkPublisher1 = "0xa3c28d4e939ce2927d3b29b7bf53d3aeaab09350"
storkPublisher2 = "0xb91C675E0c0Ecfd4c16f97B110376C3C224061d8"
storkPublisher3 = "0x51aa9e9c781f85a2c0636a835eb80114c4553098"
storkPublisher4 = "0xf024a9aa110798e5cd0d698fba6523113eaa7fb2"
storkPublisher5 = "0xf2e72022eb19352f488526e835c4b17248aa6c03"
storkPublisherAggregate = "0x0a803F9b1CCe32e2773e0d2e98b37E0775cA5d44"


