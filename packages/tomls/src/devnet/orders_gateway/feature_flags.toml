# Devnet orders gateway feature flags: unpause, matching engine publisher, conditional orders
[invoke.orders_gateway_unpause]
target = ["OrdersGatewayProxy"]
fromCall.func = "owner"
func = "setFeatureFlagAllowAll"
args = ["<%= keccak256(hexlify('global')) %>", true]
depends = ["invoke.upgrade_orders_gateway_proxy"]

[invoke.orders_gateway_set_pausers]
target = ["OrdersGatewayProxy"]
fromCall.func = "owner"
func = "setDeniers"
args = [
    "<%= keccak256(hexlify('global')) %>",
    [
        "<%= settings.pauser1 %>",
        "<%= settings.pauser2 %>",
        "<%= settings.pauser3 %>",
        "<%= settings.pauser4 %>",
    ],
]
depends = ["invoke.upgrade_orders_gateway_proxy"]

[invoke.orders_gateway_enable_matching_engine_publisher_1]
target = ["OrdersGatewayProxy"]
fromCall.func = "owner"
func = "addToFeatureFlagAllowlist"
args = [
    "<%= keccak256(hexlify('matching_engine_publisher')) %>",
    "<%= settings.matching_engine_publisher1 %>",
]
depends = ["invoke.upgrade_orders_gateway_proxy"]

[invoke.orders_gateway_enable_co_execution_bot_1]
target = ["OrdersGatewayProxy"]
fromCall.func = "owner"
func = "addToFeatureFlagAllowlist"
args = [
    "<%= keccak256(hexlify('conditional_orders')) %>",
    "<%= settings.co_execution_bot1 %>",
]
depends = ["invoke.upgrade_orders_gateway_proxy"]

[invoke.orders_gateway_enable_co_execution_bot_2]
target = ["OrdersGatewayProxy"]
fromCall.func = "owner"
func = "addToFeatureFlagAllowlist"
args = [
    "<%= keccak256(hexlify('conditional_orders')) %>",
    "<%= settings.co_execution_bot2 %>",
]
depends = ["invoke.upgrade_orders_gateway_proxy"]

[invoke.orders_gateway_enable_co_execution_bot_3]
target = ["OrdersGatewayProxy"]
fromCall.func = "owner"
func = "addToFeatureFlagAllowlist"
args = [
    "<%= keccak256(hexlify('conditional_orders')) %>",
    "<%= settings.co_execution_bot3 %>",
]
depends = ["invoke.upgrade_orders_gateway_proxy"]

# ws-exec horizontal scale to 4 replicas (P16 launch-gate): one executor key per
# pod ordinal, each allowlisted for conditional_orders (the batchExecuteFill gate).
[invoke.orders_gateway_enable_co_execution_bot_4]
target = ["OrdersGatewayProxy"]
fromCall.func = "owner"
func = "addToFeatureFlagAllowlist"
args = [
    "<%= keccak256(hexlify('conditional_orders')) %>",
    "<%= settings.co_execution_bot4 %>",
]
depends = ["invoke.upgrade_orders_gateway_proxy"]

[invoke.orders_gateway_enable_co_execution_bot_5]
target = ["OrdersGatewayProxy"]
