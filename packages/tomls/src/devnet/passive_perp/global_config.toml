# Devnet passive perp global config: uses hardcoded Cronos PassivePool address
#
# oracleManagerAddress is the LITERAL CREATE2 address of devnet's own
# OracleManager proxy (owner + oracleManagerSalt; byte-identical across 4
# independent dry-runs). setGlobalConfiguration validates the manager
# on-chain, so this step must run after the manager proxy is cloned AND
# upgraded — hence the explicit upgrade_oracle_manager_proxy dependency.
# (An imports.reyaOracleManagerProxy reference here also failed cli-devnet
# template evaluation when combined with parseEther in the same args struct,
# which is why the address is a literal; the OracleConfiguration fork checks
# assert the deployed stack matches it.)
[invoke.passive_perp_global_config]
target = ["PassivePerpProxy"]
fromCall.func = "owner"
func = "setGlobalConfiguration"
args = [
    { coreProxy = "<%= contracts.CoreProxy.address %>", exchangeProxy_DEPRECATED = "<%= AddressZero %>", oracleManagerAddress = "0xEA0F138fa958a7beeA2b448C5a27141056c45A97", maxAbsFundingRate = "<%= parseEther(settings.maxAbsFundingRateUnscaled) %>", dustAccountId = "0" },
]
depends = ["invoke.upgrade_passive_perp_proxy", "invoke.upgrade_oracle_manager_proxy"]
