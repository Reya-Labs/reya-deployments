# Devnet rSelini global collateral config -- mirrors mainnet rselini*.
#
# Reuses the existing Cronos rSelini deployment (devnet does not deploy the LM
# share tokens; see the omnibus's existing_cronos_contracts block). Required
# before the CP1 entry: Core's setCollateralConfig calls
# GlobalCollateralConfiguration.getCollateralDecimals, which reverts
# GlobalCollateralNotFound until this step has cached the token's decimals.
#
# No spot market: only wETH has one on devnet. Mainnet additionally creates a
# rSelini/rUSD spot market with every parameter zero and no orderbook
# allowlisting, which exists purely to seed reference-data metadata -- devnet
# has no such consumer, so it is left out.
[invoke.rselini_global_collateral_config]
target = ["CoreProxy"]
fromCall.func = "owner"
func = "setGlobalCollateralConfig"
args = [
    "<%= settings.rseliniProxyAddress %>",
    { collateralAdapter_DEPRECATED = "<%= settings.rseliniCollateralAdapter %>", withdrawalWindowSize = "<%= settings.rseliniWithdrawalWindowSize %>", withdrawalTvlPercentageLimit = "<%= parseEther(settings.rseliniWithdrawalTvlPercentageLimitUnscaled)  %>" },
]
depends = ['invoke.upgrade_core_proxy', 'var.global_collateral_configs']

[invoke.rselini_auto_exchange_access]
target = ["CoreProxy"]
fromCall.func = "owner"
func = "setFeatureFlagAllowAll"
args = [
    "<%= keccak256(defaultAbiCoder.encode(['bytes32','address'],[keccak256(hexlify('autoExchange')), settings.rseliniProxyAddress])) %>",
    true,
]
depends = ["invoke.upgrade_core_proxy"]
