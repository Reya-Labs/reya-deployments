# Devnet deUSD global collateral config -- mirrors mainnet deusd*.
# No spot market: only wETH has one on devnet.
[invoke.deusd_global_collateral_config]
target = ["CoreProxy"]
fromCall.func = "owner"
func = "setGlobalCollateralConfig"
args = [
    "<%= settings.deusdProxyAddress %>",
    { collateralAdapter_DEPRECATED = "<%= settings.deusdCollateralAdapter %>", withdrawalWindowSize = "<%= settings.deusdWithdrawalWindowSize %>", withdrawalTvlPercentageLimit = "<%= parseEther(settings.deusdWithdrawalTvlPercentageLimitUnscaled)  %>" },
]
depends = ['invoke.upgrade_core_proxy', 'var.global_collateral_configs']

[invoke.deusd_auto_exchange_access]
target = ["CoreProxy"]
fromCall.func = "owner"
func = "setFeatureFlagAllowAll"
args = [
    "<%= keccak256(defaultAbiCoder.encode(['bytes32','address'],[keccak256(hexlify('autoExchange')), settings.deusdProxyAddress])) %>",
    true,
]
depends = ["invoke.upgrade_core_proxy"]
