# Devnet pool 1 (rUSD-quoted) on devnet's OWN PassivePool proxy.
#
# Mirrors ../../passive_pool/configs/pools/pool_1rusd.toml with two
# devnet-specific differences:
#
#   1. rUSD is referenced through `settings.rusdProxyAddress` (devnet reuses
#      the Cronos rUSD token) rather than `contracts.RUSDProxy.address`,
#      because devnet does not deploy the token package.
#   2. The `setAllocationConfiguration` step and the `setTargetRatioPostQuote`
#      steps (DEUSD / SDEUSD / RSELINI / RAMBER / RHEDGE) are dropped. Two
#      independent reasons, and the second is worth knowing about:
#        - devnet deploys none of those collateral tokens, and the shared file
#          reaches them via `contracts.*Proxy`, which devnet cannot resolve;
#        - NEITHER FUNCTION EXISTS. `setAllocationConfiguration` and
#          `setTargetRatioPostQuote` are absent from the passive-pool source
#          (only the `AllocationConfiguration` storage library exists) and from
#          the deployed router ABI, and cronos / mainnet / devnet all pin the
#          same `reya-exchange-passive-pool:1.0.14@router`. So those six steps
#          fail on every environment, not just here — cannon skips them with a
#          warning rather than failing the build, which is why it has gone
#          unnoticed. Raised separately; not fixed here.
#
# Tokenization DOES run here, against devnet's own sRUSD (see
# ../token/srusd.toml). It must not be pointed at the Cronos sRUSD instance:
# that token's supply represents claims on the Cronos pool, and a second pool
# minting it would give holders ambiguous claims across two pools. The
# pool-side guard would not catch that — `tokenizePool` only reverts when THIS
# pool's storage is already tokenized, and a fresh proxy's storage is empty.
[invoke.passive_pool_create_pool_1rusd]
target = ["PassivePoolProxy"]
abi = "<%= JSON.stringify(contracts.PassivePoolProxy.abi.concat([{'type':'event','name':'PoolCreated','inputs':[{'name':'poolId','type':'uint128','indexed':true,'internalType':'uint128'},{'name':'quoteToken','type':'address','indexed':true,'internalType':'address'},{'name':'accountId','type':'uint128','indexed':true,'internalType':'uint128'},{'name':'blockTimestamp','type':'uint256','indexed':false,'internalType':'uint256'}],'anonymous':false}])) %>"
fromCall.func = "owner"
func = "createPool"
args = ["<%= settings.rusdProxyAddress %>"]
var.pool1RusdId.event = "PoolCreated"
var.pool1RusdId.arg = 0
var.pool1RusdAccountId.event = "PoolCreated"
var.pool1RusdAccountId.arg = 2
depends = ["invoke.passive_pool_global_config"]

[invoke.passive_pool_unpause_pool_1rusd]
target = ["PassivePoolProxy"]
fromCall.func = "owner"
func = "setFeatureFlagAllowAll"
args = [
    "<%= keccak256(defaultAbiCoder.encode(['bytes32','uint128'],[keccak256(hexlify('poolEnabled')),settings.pool1RusdId])) %>",
    true,
]
depends = ["invoke.passive_pool_create_pool_1rusd"]

# Genesis liquidity. A freshly-created pool has zero staked supply, and
# getSharePrice reverts ZeroStakedSupply until someone stakes — which makes
# the REYAPOOL#1 oracle node UNREGISTRABLE: StorkOffchainLookupNode.isValid
# calls getLatestPricePayload at registerNode time, which routes through
# getSharePrice. Cronos and mainnet never hit this because their pools held
# liquidity long before the node registration existed. So devnet stakes a
# small genesis deposit from the owner (which holds ample devnet rUSD; no
# mint involved). Ordering is tokenize -> seed -> register node: this
# router's addLiquidity requires a tokenized pool (PoolNotTokenized
# otherwise), and the shares it mints land on the owner as sRUSD, which is
# why the owner is an sRUSD authorizedHolder (see ../token/srusd.toml).
# 10,000 rUSD at genesis => share price exactly 1.0, drifting with pool PnL
# thereafter, which is precisely what the oracle node should report.
[invoke.rusd_approve_pool_seed]
target = ["<%= settings.rusdProxyAddress %>"]
abi = "<%= JSON.stringify([{'type':'function','name':'approve','inputs':[{'name':'spender','type':'address'},{'name':'amount','type':'uint256'}],'outputs':[{'name':'','type':'bool'}],'stateMutability':'nonpayable'}]) %>"
from = "<%= settings.owner %>"
func = "approve"
args = ["<%= contracts.PassivePoolProxy.address %>", "10000000000"]
depends = ["invoke.upgrade_passive_pool_proxy"]

# The pool's Core account must be activated on a market before it can hold
# deposits: Core resolves an account's collateral pool through its
# firstMarketId (AccountCollateral.getPool -> Market.exists), so a deposit
# into a never-activated account reverts MarketNotFound(0). Cronos/mainnet
# never scripted this because their pools started taking stakes long after
# markets existed (devnet's standalone backstop account was market-activated
# out-of-band for the same reason). The call goes through the pool's
# sendCallToCore so msg.sender at Core is the pool proxy — the account's
# owner, hence ADMIN. 0xed5c71a0 = selector of
# activateFirstMarketForAccount(uint128,uint128).
[invoke.passive_pool_activate_market_for_pool_account]
target = ["PassivePoolProxy"]
fromCall.func = "owner"
func = "sendCallToCore"
args = [
    "<%= '0xed5c71a0' + defaultAbiCoder.encode(['uint128','uint128'], [settings.pool1RusdAccountId, settings.market1EthId]).slice(2) %>",
]
depends = [
    "invoke.passive_pool_create_pool_1rusd",
    "invoke.passive_pool_global_config",
    "invoke.market_1eth_unpause_market",
]

[invoke.passive_pool_seed_pool_1rusd]
target = ["PassivePoolProxy"]
from = "<%= settings.owner %>"
func = "addLiquidityTokenized"
args = [
    "<%= settings.pool1RusdId %>",
    "<%= settings.owner %>",
    "10000000000",
    "0",
    # Action.StakeTokenized = 3, and onBehalfOf must equal the stake owner
    # exactly: anything else trips the actionMetadataOverwrite gate, which
    # only the periphery and core are allowlisted for. The TOKENIZED variant
    # is load-bearing: plain addLiquidity credits the internal account
    # ledger without minting sRUSD, and the share supply that getSharePrice
    # divides by is IERC20(sRUSD).totalSupply() — a non-tokenized seed
    # leaves it at zero and the pool node still cannot register.
    { action = "3", onBehalfOf = "<%= settings.owner %>" },
]
depends = [
    "invoke.passive_pool_create_pool_1rusd",
    "invoke.passive_pool_unpause_pool_1rusd",
    "invoke.passive_pool_open_deposits",
    "invoke.passive_pool_tokenize_pool_1rusd",
    "invoke.passive_pool_activate_market_for_pool_account",
    "invoke.srusd_authorized_holders_allow_owner",
    "invoke.rusd_approve_pool_seed",
    # The deposit performs a margin walk over the LIVE collateral set, so
    # every already-registered collateral must point at nodes THIS manager
    # can process before the seed lands.
    "invoke.cp_1rusd_set_rusd_config",
    "invoke.cp_1rusd_set_weth_config",
    "invoke.cp_1rusd_repair_legacy_srusd_config",
]

[invoke.passive_pool_tokenize_pool_1rusd]
target = ["PassivePoolProxy"]
fromCall.func = "owner"
func = "tokenizePool"
args = ["<%= settings.pool1RusdId %>", "<%= contracts.SRUSDProxy.address %>"]
depends = [
    "invoke.passive_pool_create_pool_1rusd",
    "invoke.passive_pool_unpause_pool_1rusd",
    "invoke.upgrade_srusd_proxy",
    "invoke.srusd_initialize",
    "invoke.srusd_mint_permission",
    "invoke.srusd_burn_permission",
    "invoke.srusd_authorized_holders_allow_pool",
]
